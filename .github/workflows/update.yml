name: 갱신과 배포

on:
  schedule:
    # KST 새벽 5시(UTC 20시)와 오후 5시(UTC 8시). 패치 직후에도 하루 안에 잡힌다.
    - cron: "0 20 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/config.json"
      - "data/fundamentals.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.build.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: 테스트
        run: python -m pytest tests/ -q

      - name: 빌드
        id: build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python -m src.build
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2 = 셋 게이트 정지. 실패가 아니라 설계된 거부다.
          if [ "$code" -eq 2 ]; then
            echo "::warning::셋 게이트 정지 — 집계가 아직 이번 셋이 아니다. 배포를 건너뛴다."
            exit 0
          fi
          exit $code

      - name: 스냅샷 커밋
        if: steps.build.outputs.code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/
          git diff --staged --quiet || git commit -m "chore: $(date -u +%Y-%m-%d) 스냅샷"
          git push

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.code == '0'

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.code == '0'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.code == '0'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
